<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание тура</title>
    <style>
        body {
          font-family: sans-serif;
          max-width: 800px;
          margin: 30px auto;
          padding: 20px;
        }

        label {
          display: block;
          margin: 15px 0 5px;
        }

        input, select, textarea {
          width: 100%;
          padding: 6px;
          box-sizing: border-box;
        }

        .tag-grid {
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          gap: 5px;
          margin: 10px 0;
        }

        .tag-button {
          padding: 6px;
          border: 1px solid #ccc;
          background-color: #f0f0f0;
          cursor: pointer;
          border-radius: 4px;
          text-align: center;
          font-size: 14px;
        }

        .tag-button.active {
          background-color: #007bff;
          color: white;
          border-color: #007bff;
        }

        button[type="submit"] {
          margin-top: 20px;
          padding: 10px;
        }
    </style>
</head>
<body>
<h1>Создание тура</h1>

<form id="tourForm" enctype="multipart/form-data">
    <label>Название тура: <input type="text" name="tour.title" required></label>

    <label>Локация:
        <select name="tour.locationId" id="locationSelect" required>
            <option value="">Загрузка...</option>
        </select>
    </label>

    <label>Цена: <input type="number" name="tour.price" required></label>
    <label>Длительность (часы): <input type="number" step="0.1" name="tour.duration" required></label>
    <label>Длина маршрута (км): <input type="number" step="0.1" name="tour.routeLength" required></label>
    <label>Мин. возраст: <input type="number" name="tour.minAge" required></label>
    <label>Макс. вместимость: <input type="number" name="tour.maxCapacity" required></label>

    <label>Формат экскурсии:
        <select name="tour.tourType" required>
            <option value="GROUP">GROUP</option>
            <option value="PERSONAL">PERSONAL</option>
        </select>
    </label>

    <label>Тип транспорта:
        <select name="tour.transportType" required>
            <option value="WALKING">WALKING</option>
            <option value="BUS">BUS</option>
            <option value="CAR">CAR</option>
        </select>
    </label>

    <label>Описание - Основное:
        <textarea name="tour.description.mainInfo" required></textarea>
    </label>
    <label>Описание - Что ожидать:
        <textarea name="tour.description.whatToExpect" required></textarea>
    </label>
    <label>Описание - Организационные детали:
        <textarea name="tour.description.orgDetails" required></textarea>
    </label>
    <label>Описание - Место встречи:
        <textarea name="tour.description.meetingPlace" required></textarea>
    </label>

    <label>Категории тура (теги):</label>
    <div class="tag-grid" id="tagGrid">Загрузка...</div>
    <input type="hidden" name="tour.vectorRepresentation" id="vectorRepresentation">

    <label>Изображения: <input type="file" name="images" multiple required></label>

    <button type="submit">Создать тур</button>
</form>

<script>
    const tagGrid = document.getElementById('tagGrid');
    const vectorInput = document.getElementById('vectorRepresentation');
    const locationSelect = document.getElementById('locationSelect');

    const tagState = Array(32).fill(0); // Вектор

    // Загрузка тегов
    async function loadTags() {
      try {
        const res = await fetch('/api/tags', { credentials: 'include' });
        const tags = await res.json();
        tagGrid.innerHTML = '';

        tags.slice(0, 32).forEach((tag, i) => {
          const btn = document.createElement('div');
          btn.classList.add('tag-button');
          btn.textContent = tag.name;
          btn.dataset.index = i;

          btn.addEventListener('click', () => {
            const idx = +btn.dataset.index;
            tagState[idx] = tagState[idx] === 0 ? 1 : 0;
            btn.classList.toggle('active');
          });

          tagGrid.appendChild(btn);
        });
      } catch (e) {
        tagGrid.innerHTML = '<p>Ошибка загрузки тегов.</p>';
        console.error('Ошибка загрузки тегов:', e);
      }
    }

    // Загрузка локаций
    async function loadLocations() {
      try {
        const res = await fetch('/api/locations', { credentials: 'include' });
        const locations = await res.json();
        locationSelect.innerHTML = '<option value="">Выберите локацию</option>';

        locations.forEach(loc => {
          const opt = document.createElement('option');
          opt.value = loc.id;
          opt.textContent = `${loc.city}, ${loc.region}`;
          locationSelect.appendChild(opt);
        });
      } catch (e) {
        locationSelect.innerHTML = '<option>Ошибка загрузки</option>';
        console.error('Ошибка загрузки локаций:', e);
      }
    }

    loadTags();
    loadLocations();

    // Обработка формы
document.getElementById('tourForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const form = new FormData(this);
  form.set('tour.vectorRepresentation', tagState.join(','));

  try {
    const res = await fetch('/api/tours', {
      method: 'POST',
      body: form,
      credentials: 'include'
    });

    // Проверка наличия тела
    const text = await res.text();
    const result = text ? JSON.parse(text) : null;

    if (res.ok) {
      alert('Тур успешно создан!');
      if (result) console.log(result);
    } else {
      alert('Ошибка при создании тура: ' + (result ? JSON.stringify(result) : text));
    }
  } catch (err) {
    alert('Ошибка отправки: ' + err.message);
  }
});

</script>
</body>
</html>
